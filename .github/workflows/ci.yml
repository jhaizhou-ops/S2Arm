# 公开仓 CI：只用 GitHub 托管 runner，不依赖维护者机器、私有 secret 和 S2A_PRIVATE_TOOLS。
#   linux：平台无关的快速门禁；macos：贡献者自检 tools/contrib_check.sh（第一层；第二层由维护者在合入列车里跑）。
#   plan 先判定；只有根 README 的普通文本修改走轻量扫描。原任务名称保留，避免改变必需检查名称。
name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      readme_only: ${{ steps.plan.outputs.readme_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - name: CI 分流回归
        run: python3 tests/ci_readme_plan_test.py
      - name: 判定改动范围
        id: plan
        run: python3 tools/ci_readme_plan.py
  linux:
    needs: plan
    # plan 本身异常时也要报告失败，不能让原必需检查因 needs 被一起跳过。
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 确认分流成功
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
        run: test "$PLAN_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - name: 分层登记
        if: ${{ needs.plan.outputs.readme_only != 'true' }}
        run: python3 tools/layer_map.py check
      - name: 单测接线
        if: ${{ needs.plan.outputs.readme_only != 'true' }}
        run: python3 tools/test_wired_lint.py
      - name: 公开仓扫描（全量）
        if: ${{ needs.plan.outputs.readme_only != 'true' }}
        run: python3 tools/public_repo_scan.py --repo . --ref HEAD --path . --format gate
      - name: README 公开仓扫描（仅两份文档）
        if: ${{ needs.plan.outputs.readme_only == 'true' }}
        run: python3 tools/public_repo_scan.py --repo . --ref HEAD --path README.md --path README.zh-CN.md --format gate
  macos:
    needs: plan
    # 私有仓 macOS 分钟按 10 倍计：私有时只在手动触发时跑，转公开后自动跑
    if: ${{ needs.plan.outputs.readme_only != 'true' && (github.event.repository.private == false || github.event_name == 'workflow_dispatch') }}
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73  # v6.1.0
        with:
          global-json-file: compat/tree/global.json
      - name: bash 5 与钉版 Python 包
        run: |
          brew install bash
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          python3 -m pip install -r tools/rewriter-requirements.txt
      - name: 兼容层上游基线
        run: bash compat/fetch_base.sh
      - name: 贡献者自检
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: bash tools/contrib_check.sh --base "$BASE"
